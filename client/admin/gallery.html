<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Management</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>Mbugangari Home</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html">House</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="places.html">Nearby Places</a></li>
        </ul>
    </aside>
<main class="main-content">

    <header class="topbar">

        <h1>Gallery Management</h1>

        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>

        <button id="logoutBtn">

            Logout

        </button>

    </header>

    <div id="galleryFormCard" class="form-card hidden">

        <h2 id="galleryFormTitle">

            Upload Image

        </h2>

        <form id="galleryForm">

            <label for="image">

                Image File

            </label>

            <input
                type="file"
                id="image"
                accept="image/*"
                required
            >

            <label for="caption">

                Caption

            </label>

            <input
                type="text"
                id="caption"
                placeholder="Describe the image"
            >

            <label for="house_id">

                House

            </label>

            <select
                id="house_id"
                required
            >

                <option value="">

                    Select a house

                </option>

            </select>

            <p class="field-note">

                Choose a house record before uploading the gallery image.

            </p>

            <div class="form-actions">

                <button
                    type="submit"
                    class="saveBtn">

                    Upload Image

                </button>

                <button
                    type="button"
                    id="cancelGalleryBtn"
                    class="secondaryBtn">

                    Cancel

                </button>

            </div>

        </form>

    </div>

    <section class="table-card">

        <div class="section-header">

            <h2>

                Gallery Images

            </h2>

            <div class="table-actions">

                <input
                    id="searchGallery"
                    type="search"
                    placeholder="Search captions..."
                >

                <button id="addGalleryBtn">

                    + Upload Image

                </button>

            </div>

        </div>

        <div
            id="galleryTable"
            class="admin-table"
        ></div>

    </section>

</main>
</div>

<div id="confirmModal" class="modal hidden">

    <div class="modal-content">

        <h3 id="confirmTitle">Confirm Action</h3>

        <p id="confirmMessage">
            Are you sure?
        </p>

        <div class="modal-buttons">

            <button
                id="confirmCancel"
                class="secondaryBtn">

                Cancel

            </button>

            <button
                id="confirmOk"
                class="deleteBtn">

                Delete

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminHouseHelpers.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/adminGallery.js"></script>

<script src="../js/theme.js"></script>


</body>

</html>
