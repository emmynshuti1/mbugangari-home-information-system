<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>House Management</title>

    <link rel="stylesheet" href="../css/admin.css">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Mbugangari Home</h2>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html" class="active">House</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="places.html">Nearby Places</a></li>

        </ul>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <h1>House Management</h1>

            <button
                id="themeToggle"
                class="theme-toggle"
                aria-label="Toggle theme">

                🌙

            </button>

            <button id="logoutBtn">

                Logout

            </button>

        </header>

        <div class="form-card">

            <h2>

                Edit House Information

            </h2>

            <form id="houseForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">

                            House Name

                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="owner">

                            Owner

                        </label>

                        <input
                            type="text"
                            id="owner"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="year_built">

                            Year Built

                        </label>

                        <input
                            type="number"
                            id="year_built"
                        >

                    </div>

                    <div class="form-group">

                        <label for="village">

                            Village

                        </label>

                        <input
                            type="text"
                            id="village"
                        >

                    </div>

                    <div class="form-group">

                        <label for="sector">

                            Sector

                        </label>

                        <input
                            type="text"
                            id="sector"
                        >

                    </div>

                    <div class="form-group">

                        <label for="district">

                            District

                        </label>

                        <input
                            type="text"
                            id="district"
                        >

                    </div>

                    <div class="form-group">

                        <label for="province">

                            Province

                        </label>

                        <input
                            type="text"
                            id="province"
                        >

                    </div>

                    <div class="form-group">

                        <label for="country">

                            Country

                        </label>

                        <input
                            type="text"
                            id="country"
                        >

                    </div>

                    <div class="form-group">

                        <label for="latitude">

                            Latitude

                        </label>

                        <input
                            type="number"
                            step="0.0000001"
                            id="latitude"
                        >

                    </div>

                    <div class="form-group">

                        <label for="longitude">

                            Longitude

                        </label>

                        <input
                            type="number"
                            step="0.0000001"
                            id="longitude"
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="description">

                        Description

                    </label>

                    <textarea
                        id="description"
                        rows="6"
                        required
                    ></textarea>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="saveHouse"
                        class="saveBtn">

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

<div id="confirmModal" class="modal hidden">

    <div class="modal-content">

        <h3 id="confirmTitle">

            Confirm Action

        </h3>

        <p id="confirmMessage">

            Are you sure?

        </p>

        <div class="modal-buttons">

            <button
                id="confirmCancel"
                class="secondaryBtn">

                Cancel

            </button>

            <button
                id="confirmOk"
                class="deleteBtn">

                Delete

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/adminHouse.js"></script>
<script src="../js/theme.js"></script>

</body>

</html>
