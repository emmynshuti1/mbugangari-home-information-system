<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rooms Management</title>

<link rel="stylesheet" href="../css/admin.css">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Mbugangari Home</h2>

        <ul>

            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html">House</a></li>
            <li><a href="rooms.html" class="active">Rooms</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="places.html">Nearby Places</a></li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <h1>Rooms Management</h1>

                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button id="logoutBtn">

                Logout

            </button>

        </header>

        <section class="table-card">
            <div class="section-header">
                <h2>Rooms</h2>
                <div class="table-actions">
                    <div class="select-group">
                        <label for="room_house_id">House</label>
                        <select id="room_house_id" required>
                            <option value="">Select a house</option>
                        </select>
                    </div>
                    <input id="searchRoom" type="search" placeholder="Search rooms...">
                    <button id="addRoomBtn">+ Add Room</button>
                </div>
                <p class="field-note">Choose a house before adding a room.</p>
            </div>
            <div class="table-wrapper">
                <table id="roomsTable">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Floor</th>

                    <th>Size</th>

                    <th>Image</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>
            </div>
        </section>

    </main>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminHouseHelpers.js"></script>
<script src="../js/adminRooms.js"></script>

    <script src="../js/theme.js"></script>
</body>

</html>
