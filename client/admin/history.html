<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Management</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>Mbugangari Home</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html">House</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html" class="active">History</a></li>
            <li><a href="places.html">Nearby Places</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1>History Management</h1>
                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button id="logoutBtn">Logout</button>
        </header>

       <div id="historyFormCard" class="form-card hidden">

    <h2 id="historyFormTitle">

        Add History Entry

    </h2>

    <form id="historyForm">

        <input
            type="hidden"
            id="historyId"
        >

        <div class="form-grid">

            <div class="form-group">

                <label>House</label>

                <select id="house_id" required>

                    <option value="">Select a house</option>

                </select>

            </div>

            <div class="form-group">

                <label>Title</label>

                <input
                    type="text"
                    id="title"
                    required
                >

            </div>

            <div class="form-group">

                <label>Event Date</label>

                <input
                    type="date"
                    id="event_date"
                >

            </div>

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                id="description"
                rows="6"
            ></textarea>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="saveBtn">

                Save History

            </button>

            <button
                type="button"
                id="cancelHistoryBtn"
                class="secondaryBtn">

                Cancel

            </button>

        </div>

    </form>

</div>

        <section class="table-card">
           <div class="section-header">

    <h2>History Entries</h2>

    <div class="table-actions">

        <input
            id="searchHistory"
            type="search"
            placeholder="Search history..."
        >

        <button id="addHistoryBtn">

            + Add History

        </button>

    </div>

</div>
            <div id="historyTable" class="admin-table"></div>
        </section>
    </main>
</div>

<div id="confirmModal" class="modal hidden">

    <div class="modal-content">

        <h3 id="confirmTitle">Confirm Action</h3>

        <p id="confirmMessage">
            Are you sure?
        </p>

        <div class="modal-buttons">

            <button
                id="confirmCancel"
                class="secondaryBtn">

                Cancel

            </button>

            <button
                id="confirmOk"
                class="deleteBtn">

                Delete

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminHouseHelpers.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/adminHistory.js"></script>

<script src="../js/theme.js"></script>
</body>

</html>
