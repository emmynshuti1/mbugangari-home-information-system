<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Management</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>Mbugangari Home</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html">House</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html" class="active">History</a></li>
            <li><a href="places.html">Nearby Places</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1>History Management</h1>
                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button id="logoutBtn">Logout</button>
        </header>

        <section class="welcome-card">
            <h2>Add History Entry</h2>
            <form id="historyForm">
                <label for="title">Title</label>
                <input type="text" id="title" required>

                <label for="event_date">Event Date</label>
                <input type="date" id="event_date">

                <label for="house_id">House</label>
                <select id="house_id" required>
                    <option value="">Select a house</option>
                </select>
                <p class="field-note">Choose the house this entry belongs to.</p>

                <label for="detail">Detail</label>
                <textarea id="detail" rows="7"></textarea>

                <button type="submit">Add Entry</button>
            </form>
        </section>

        <section class="table-card">
            <div class="section-header">
                <h2>History Entries</h2>
                <input id="searchHistory" type="search" placeholder="Search history...">
            </div>
            <div id="historyTable" class="admin-table"></div>
        </section>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminHouseHelpers.js"></script>
<script src="../js/adminHistory.js"></script>

    <script src="../js/theme.js"></script>
</body>

</html>
