<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Login | Mbugangari Home Information System</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                🏡

            </div>

            <h1>

                Administrator Login

            </h1>

            <p>

                Sign in to manage the Mbugangari Home Information System.

            </p>

            <form id="loginForm">

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >

                    Login

                </button>

            </form>

            <div id="message"></div>

            <a href="../index.html" class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/theme.js"></script>

</body>

</html>
