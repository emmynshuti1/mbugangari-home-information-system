<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nearby Places · Mbugangari Home Admin</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Poppins:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/theme.js"></script>
</head>
<body>

<div class="boot" aria-live="polite"><div><span class="spinner" aria-hidden="true"></span> Checking your session…</div></div>

<div class="admin">
    <aside class="sidebar" id="sidebar" aria-label="Administration">
        <a class="sidebar-brand" href="dashboard.html">
            <img src="../favicon.svg" alt="" width="36" height="36">
            <div><strong>Mbugangari Home</strong><span>Administration</span></div>
        </a>

        <p class="sidebar-label">Content</p>
        <nav class="sidebar-nav">
            <a href="dashboard.html" data-icon="dashboard">Dashboard</a>
            <a href="houses.html" data-icon="home">House</a>
            <a href="rooms.html" data-icon="door">Rooms</a>
            <a href="gallery.html" data-icon="image">Gallery</a>
            <a href="materials.html" data-icon="brick">Materials</a>
            <a href="history.html" data-icon="clock">History</a>
            <a href="places.html" aria-current="page" data-icon="pin">Nearby Places</a>
        </nav>

        <div class="sidebar-footer">
            <nav class="sidebar-nav">
                <a href="../index.html" target="_blank" rel="noopener" data-icon="globe">View website</a>
                <button type="button" data-logout data-icon="logout">Log out</button>
            </nav>
            <div class="sidebar-user">
                <span class="avatar" data-admin-initials>A</span>
                <div><strong data-admin-name>Administrator</strong><span data-admin-email></span></div>
            </div>
        </div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu" data-icon="menu"></button>
            <div>
                <h1>Nearby Places</h1>
                <p>Landmarks and services near the home</p>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
            </div>
        </header>

        <main class="content" id="main">
            <div id="resource"></div>
        </main>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminCrud.js"></script>
<script src="../js/adminPlaces.js"></script>
</body>
</html>
