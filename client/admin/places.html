<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Places Management</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>Mbugangari Home</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="houses.html">House</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="materials.html">Materials</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="places.html" class="active">Nearby Places</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1>Nearby Places Management</h1>
                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            <button id="logoutBtn">Logout</button>
        </header>

       <div id="placeFormCard" class="form-card hidden">

    <h2 id="placeFormTitle">

        Add Nearby Place

    </h2>

    <form id="placeForm">

        <input
            type="hidden"
            id="placeId"
        >

        <div class="form-grid">

            <div class="form-group">

                <label>House</label>

                <select id="house_id" required>

                    <option value="">Select a house</option>

                </select>

            </div>

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    id="category"
                    placeholder="Market, School..."
                >

            </div>

            <div class="form-group">

                <label>Distance (meters)</label>

                <input
                    type="number"
                    id="distance_meters"
                    min="0"
                >

            </div>

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                id="description"
                rows="5"
            ></textarea>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="saveBtn">

                Save Place

            </button>

            <button
                type="button"
                id="cancelPlaceBtn"
                class="secondaryBtn">

                Cancel

            </button>

        </div>

    </form>

</div>

        <section class="table-card">
           <div class="section-header">

    <h2>Nearby Places</h2>

    <div class="table-actions">

        <input
            id="searchPlace"
            type="search"
            placeholder="Search places..."
        >

        <button id="addPlaceBtn">

            + Add Nearby Place

        </button>

    </div>

</div>
            <div id="placesTable" class="admin-table"></div>
        </section>
    </main>
</div>

<div id="confirmModal" class="modal hidden">

    <div class="modal-content">

        <h3 id="confirmTitle">Confirm Action</h3>

        <p id="confirmMessage">
            Are you sure?
        </p>

        <div class="modal-buttons">

            <button
                id="confirmCancel"
                class="secondaryBtn">

                Cancel

            </button>

            <button
                id="confirmOk"
                class="deleteBtn">

                Delete

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminHouseHelpers.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/adminPlaces.js"></script>

    <script src="../js/theme.js"></script>
</body>

</html>
